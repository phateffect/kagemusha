services:
  kagemusha:
    build:
      context: .
      dockerfile: Dockerfile

    image: localhost/kagemusha:local

    restart: unless-stopped

    init: true

    ports:
      - "127.0.0.1:${KAGEMUSHA_HTTP_PORT:-8000}:8000"

    environment:
      GWS_DATA_DIR: /data
      GWS_API_TOKEN: ${GWS_API_TOKEN:?required}

      GWS_MAX_CONCURRENT_GIT: "4"
      GWS_GIT_TIMEOUT_SECONDS: "300"

      GWS_DEFAULT_DEPTH: "50"
      GWS_MAX_DEPTH: "1000"

      GWS_ZSTD_LEVEL: "3"
      GWS_ZSTD_THREADS: "1"

      GWS_MAX_ARCHIVE_BYTES: "1073741824"
      GWS_MAX_REQUEST_BODY_BYTES: "65536"
      GWS_TEMP_BUDGET_BYTES: "2147483648"
      GWS_TEMP_TTL_SECONDS: "3600"

      GWS_ALLOWED_GIT_HOSTS: ${GWS_ALLOWED_GIT_HOSTS:-github.com,gitlab.com}
      GWS_CA_BUNDLE: ${GWS_CA_BUNDLE:-}

    volumes:
      - kagemusha-data:/data

    stop_grace_period: 30s

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  kagemusha-data:
