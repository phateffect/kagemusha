[project]
name = "kagemusha"
version = "0.1.0"
description = "Git clones that fight your battles."
requires-python = ">=3.15,<3.16"
dependencies = [
    "aiosqlite>=0.22,<1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[project.scripts]
kagemusha = "kagemusha.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kagemusha"]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.14,<1",
    "trustme>=1.2,<2",
    "ty>=0.0.107,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
